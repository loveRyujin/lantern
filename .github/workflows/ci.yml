name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Build windows
        run: GOOS=windows go build ./...

      - name: Vet windows
        run: GOOS=windows go vet ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Lint
        run: golangci-lint run ./...

      - name: Demonstrate rejected cgo and mygo imports
        run: bash scripts/demo-constraint-ci.sh

      - name: Official eval on Linux scores 217
        run: |
          make eval REPORT_DIR="${RUNNER_TEMP}/eval-official"
          python3 scripts/check-eval-platform.py linux "${RUNNER_TEMP}/eval-official"

      - name: Intentional gate violations exit non-zero
        run: |
          set +e
          make eval-negative REPORT_DIR="${RUNNER_TEMP}/eval-negative" PLATFORM=all
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "make eval-negative 必须非零退出"
            exit 1
          fi
          python3 scripts/check-eval-negative.py "${RUNNER_TEMP}/eval-negative"

  # W1：确认 GitHub 托管的 macOS runner 还能不能调用 sandbox-exec。
  # 结论写在 docs/adr/0003-python-runtime.md，不在这里安装 Python 依赖。
  # 同一台 runner 上跑 go test ./core/pyrt/，用假解释器，不联网装 pandas。
  macos-sandbox-exec:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Probe sandbox-exec
        run: bash scripts/probe-sandbox-exec.sh

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      # #25 里祖先符号链接被误判为 path_escape，就是因为当时没有 macOS 的 go test。
      # 这里不设置 PYRT_ENSURE_REAL，不下载 wheel。
      - name: Test pyrt
        run: go test ./core/pyrt/

      - name: Darwin sandbox cases pass (mock)
        run: |
          make eval MODE=mock PLATFORM=darwin REPORT_DIR="${RUNNER_TEMP}/eval-darwin"
          python3 scripts/check-eval-platform.py darwin "${RUNNER_TEMP}/eval-darwin"

  # 在 Linux 上真实创建 venv，并用哈希锁定安装 pandas、matplotlib。允许较慢。
  pyrt-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Install python3-venv
        run: sudo apt-get update && sudo apt-get install -y python3-venv

      - name: Hash-locked install and offline prepared runtime lease
        run: PYRT_ENSURE_REAL=1 PYRT_PREPARED_REAL=1 go test ./core/pyrt/ -run 'Test(EnsureReal|PreparedReal)$' -count=1 -v -timeout 15m

      - name: Real Linux sandbox, production Python tools and Agent integration
        env:
          SANDBOX_REQUIRE_REAL: "1"
          SANDBOX_REAL_PACKAGES: "1"
        run: go test ./core/sandbox ./core/analysisdata ./core/pythonx ./core/agent ./internal/eval ./cmd/lantern-eval -count=1 -v -timeout 15m

      - name: Explicitly prepare runtime for real sandbox evaluation
        run: go run ./cmd/lantern-eval prepare-runtime --root "${RUNNER_TEMP}/lantern-eval-runtime" --out "${RUNNER_TEMP}/lantern-eval-runtime.json"

      - name: Evaluate all real Linux sandbox intents and required evidence
        run: |
          go run ./cmd/lantern-eval run --mode sandbox-real --runtime-config "${RUNNER_TEMP}/lantern-eval-runtime.json" --out "${RUNNER_TEMP}/sandbox-real-reports"
          python3 - <<'PY'
          import glob, json, os, subprocess
          paths = glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'sandbox-real-reports', '*.json'))
          assert len(paths) == 1, paths
          with open(paths[0], encoding='utf-8') as handle:
              report = json.load(handle)
          assert report['mode'] == 'sandbox-real'
          summary = report['summary']
          assert summary['scored'] == summary['passed'] == 25, summary
          assert summary['failed'] == summary['missing_observation'] == summary['skipped'] == summary['filtered'] == 0, summary
          assert summary['hard_gates_passed'] is True, summary
          evidence = report['sandbox_real']
          assert evidence['original']['required'] == evidence['original']['executed'] == evidence['original']['passed'] == 20, evidence['original']
          assert evidence['supplemental']['required'] == evidence['supplemental']['executed'] == evidence['supplemental']['passed'] == 5, evidence['supplemental']
          assert not evidence.get('preflight_failure'), evidence
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['environment']['commit'] == commit
          assert evidence['environment']['source_dirty'] is False, evidence['environment']
          assert {case['id'] for case in report['cases']} == {'SB-LINUX-%02d' % i for i in range(1, 26)}
          assert all(case['status'] == 'passed' and case.get('evidence') for case in report['cases'])
          PY

      - name: Preserve real Linux sandbox report and observations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-sandbox-real-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sandbox-real-reports/
          if-no-files-found: error

  # #40: real fixed-payload spike; not the production Sandbox.Run evaluator.
  linux-sandbox-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Install probe dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap python3
      - name: Probe actual Linux isolation
        env:
          LANTERN_REQUIRE_LANDLOCK: "1"
        run: bash scripts/probe-linux-sandbox.sh "${RUNNER_TEMP}/linux-sandbox-report.json"
      - name: Preserve environment and isolation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-sandbox-spike-${{ github.run_id }}
          path: ${{ runner.temp }}/linux-sandbox-report.json
          if-no-files-found: error

  # #52: fixed macOS experiments; a valid negative feasibility conclusion does
  # not claim a production Darwin Runner. The legacy diagnostic remains above.
  macos-sandbox-spike:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Select supported Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Explicit trusted runtime preparation
        run: go run ./cmd/lantern-eval prepare-runtime --root "${RUNNER_TEMP}/darwin-spike-runtime" --out "${RUNNER_TEMP}/darwin-spike-runtime.json"
      - name: Build pure Go experiment carrier
        run: go build -o "${RUNNER_TEMP}/lantern-darwin-probe" ./cmd/lantern-darwin-probe
      - name: Test Darwin experiment contracts
        run: go test ./cmd/lantern-darwin-probe -count=1 -v -timeout 10m
      - name: Run real isolation, lifecycle and signed bundle experiments
        run: bash scripts/probe-darwin-sandbox.sh --probe "${RUNNER_TEMP}/lantern-darwin-probe" --runtime-config "${RUNNER_TEMP}/darwin-spike-runtime.json" --out "${RUNNER_TEMP}/darwin-spike-reports"
      - name: Verify complete real experiment evidence
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          path = os.path.join(os.environ['RUNNER_TEMP'], 'darwin-spike-reports', 'report.json')
          with open(path, encoding='utf-8') as handle:
              report = json.load(handle)
          assert report['schema'] == 'lantern.darwin-spike.v1'
          assert report['status'] == 'passed', report
          assert report['feasibility'] in ('viable', 'unresolved'), report
          assert report['production_backend_available'] is False, report
          required = {'preflight', 'filesystem', 'network', 'process-profile', 'resources', 'lifecycle', 'sql-worker', 'signed-path'}
          stages = report['stages']
          assert len(stages) == len(required) and {s['id'] for s in stages} == required
          for stage in stages:
              assert stage['executed'] is True and stage['status'] == 'passed', stage
              assert stage['assertion_contracts'] and stage['checks'], stage
              assert all(c['passed'] is True for c in stage['checks']), stage
          assert report['environment']['os'] == 'darwin'
          assert report['environment']['arch'] == 'arm64', report['environment']
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['environment']['source_commit'] == commit, report['environment']
          assert report['environment']['source_dirty'] == 'false', report['environment']
          fingerprints = report['fingerprints']
          expected = {'payload_sha256', 'runtime_marker_sha256', 'executable_sha256', 'policy_sha256', 'signed_policy_sha256'}
          assert expected <= fingerprints.keys(), fingerprints
          for key in expected:
              value = fingerprints[key]
              assert len(value) == 64 and all(c in '0123456789abcdef' for c in value), (key, value)
          assert report['environment']['macos_version'] and report['environment']['macos_build']
          PY
      - name: Preserve real macOS report, policy and signature evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: darwin-sandbox-spike-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/darwin-spike-reports/
          if-no-files-found: error
