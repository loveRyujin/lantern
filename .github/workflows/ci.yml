name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Lint
        run: golangci-lint run ./...

      - name: Demonstrate rejected cgo and mygo imports
        run: bash scripts/demo-constraint-ci.sh
