name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Lint
        run: golangci-lint run ./...

      - name: Demonstrate rejected cgo and mygo imports
        run: bash scripts/demo-constraint-ci.sh

  # W1：确认 GitHub 托管的 macOS runner 还能不能调用 sandbox-exec。
  # 结论写在 docs/adr/0003-python-runtime.md，不在这里安装 Python 依赖。
  macos-sandbox-exec:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Probe sandbox-exec
        run: bash scripts/probe-sandbox-exec.sh
